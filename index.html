<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIU LawSystem | Gestión Legal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome (Iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-light">

    <!-- ========================================== -->
    <!--            PANTALLA DE LOGIN               -->
    <!-- ========================================== -->
    <div id="pantalla-login" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 mt-5">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="fa-solid fa-gavel fa-3x text-warning mb-3"></i>
                            <h3 class="fw-bold">NIU LawSystem</h3>
                            <p class="text-muted">Inicia sesión en tu cuenta</p>
                        </div>
                        
                        <!-- Mensaje de error oculto -->
                        <div id="login-error" class="alert alert-danger d-none small"></div>

                        <form id="form-login">
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold">USUARIO</label>
                                <input type="text" id="login-usuario" class="form-control" required placeholder="Ej: admin">
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-muted small fw-bold">CONTRASEÑA</label>
                                <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
                            </div>
                            <button type="submit" class="btn btn-dark w-100 fw-bold">INGRESAR</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!--            SISTEMA PRINCIPAL               -->
    <!-- ========================================== -->
    <div id="sistema-principal" class="d-none">
        
        <!-- BARRA DE NAVEGACIÓN -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand text-warning fw-bold" href="#" onclick="cargarVista('dashboard')">
                    <i class="fa-solid fa-gavel"></i> NIU LawSystem
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="cargarVista('dashboard')"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="cargarVista('clientes')"><i class="fa-solid fa-users"></i> Clientes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="cargarVista('casos')"><i class="fa-solid fa-briefcase"></i> Casos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="cargarVista('facturas')"><i class="fa-solid fa-file-invoice-dollar"></i> Facturación</a>
                        </li>
                        
                        <!-- Pestaña de Abogados: Oculta por defecto con d-none y el id="nav-abogados" -->
                        <li class="nav-item d-none" id="nav-abogados">
                            <a class="nav-link" href="#" onclick="cargarVista('abogados')"><i class="fa-solid fa-user-shield"></i> Abogados</a>
                        </li>
                    </ul>
                    
                    <div class="d-flex align-items-center">
                        <!-- Imagen de perfil del abogado -->
                        <img src="" id="img-perfil-nav" class="rounded-circle me-2 d-none" width="35" height="35" style="object-fit: cover;" alt="Perfil">
                        <span class="text-white me-3 fw-bold" id="nombre-abogado-nav">Cargando...</span>
                        <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">Salir</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- CONTENEDOR DE VISTAS DINÁMICAS -->
        <main id="app-content" class="container mt-4 mb-5">
            <!-- El archivo app.js inyectará aquí todo el HTML de las tablas y ventanas modales de tus CRUDs -->
        </main>
    </div>

    <!-- Bootstrap JS (Obligatorio para que los modales y el menú hamburguesa funcionen) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Nuestro Script Principal -->
    <script src="js/app.js"></script>
</body>
</html>
